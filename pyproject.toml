[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norfingen"
version = "0.1.0"
description = "Generator syntetycznych danych finansowych dla norweskiej firmy IT AS (Tripletex API v2)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
