name: NorFinGen daily generation

on:
  schedule:
    # 07:00, 11:00, 16:00 UTC = 08:00, 12:00, 17:00 CET (UTC+1) w okresie zimowym.
    # Uwaga: CEST (lato, UTC+2) przesunie efektywne godziny lokalne o godzinę
    # do przodu (cron GitHub Actions liczy zawsze w UTC, bez DST).
    - cron: "0 7,11,16 * * 1-5"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily generation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python run_daily.py
